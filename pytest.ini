[pytest]
# Default collection is "test_*.py" / "*_test.py" only. tests/benchmark_phrasing.py
# is named the way it is on purpose (a benchmark you can also run standalone:
# `pytest tests/benchmark_phrasing.py -v` reads clearly as "run the benchmark"),
# but it still needs to be swept up by the project's own "pytest tests/ -q"
# regression gate rather than silently skipped because of its filename.
python_files = test_*.py *_test.py benchmark_*.py

# Registered so the self-test file does not warn. "slow" marks the tests
# that shell out to a real pytest run.
markers =
    slow: shells out to a real subprocess; seconds rather than milliseconds
