<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    :root { color-scheme: light dark; }
    * { box-sizing: border-box; }
    body { font: 14px system-ui, sans-serif; margin: 0; height: 100vh;
           display: flex; flex-direction: column;
           color: #16181d; background: #fff; }
    header { display: flex; align-items: center; gap: 8px; padding: 10px 12px;
             border-bottom: 1px solid #e6e6e6; }
    header img { width: 22px; height: 22px; border-radius: 6px; }
    header .name { font-weight: 700; }
    header .status { margin-left: auto; font-size: 11px; color: #888;
                     display: flex; align-items: center; gap: 5px; }
    .dot { width: 8px; height: 8px; border-radius: 50%; background: #dc2626; }
    .dot.up { background: #16a34a; }
    #log { flex: 1; overflow-y: auto; padding: 12px; display: flex;
           flex-direction: column; gap: 10px; }
    .msg { max-width: 85%; padding: 8px 11px; border-radius: 12px;
           white-space: pre-wrap; word-wrap: break-word; line-height: 1.4; }
    .me { align-self: flex-end; background: #2563eb; color: #fff;
          border-bottom-right-radius: 3px; }
    .jalen { align-self: flex-start; background: #f1f2f4;
             border-bottom-left-radius: 3px; }
    .hint { color: #999; font-size: 12px; text-align: center; margin: auto 0; }
    form { display: flex; gap: 8px; padding: 10px; border-top: 1px solid #e6e6e6; }
    textarea { flex: 1; resize: none; font: inherit; padding: 8px 10px;
               border: 1px solid #d0d0d0; border-radius: 10px; max-height: 120px; }
    button { border: 0; background: #2563eb; color: #fff; border-radius: 10px;
             padding: 0 14px; font-weight: 600; cursor: pointer; }
    button:disabled { opacity: .5; cursor: default; }
    @media (prefers-color-scheme: dark) {
      body { color: #e8e8e8; background: #16181d; }
      header, form { border-color: #2a2d34; }
      .jalen { background: #24272e; }
      textarea { background: #1e2127; border-color: #33363d; color: #e8e8e8; }
    }
  </style>
</head>
<body>
  <header>
    <img src="../icons/icon48.png" alt="">
    <span class="name">Jalen</span>
    <span class="status"><span id="dot" class="dot"></span><span id="stat">connecting…</span></span>
  </header>
  <div id="log">
    <div class="hint" id="hint">Ask Jalen to do something — research a topic,
      fill this form, hand a task to ChatGPT, or anything you'd say out loud.</div>
  </div>
  <form id="f">
    <textarea id="t" rows="1" placeholder="Message Jalen…" autofocus></textarea>
    <button id="send" type="submit">Send</button>
  </form>
  <script src="panel.js"></script>
</body>
</html>
