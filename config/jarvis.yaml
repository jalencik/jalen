# ============================================================================
#  JALEN — master configuration
#  Everything you can change about how Jalen behaves lives in THIS file.
#  Edit it, then say "Jalen, reload config" (or restart). No code changes.
#
#  Built to O'ktam's 72-answer spec, August 2026.
# ============================================================================

# ---------------------------------------------------------------------------
# IDENTITY  (spec A1-A8)
# ---------------------------------------------------------------------------
identity:
  # Trained, measured and swapped in. He wakes to his own name now — say
  # "Hey Jalen", "Hi Jalen" or "OK Jalen". See scripts/train_wake_word.py
  # for how the model was built and wake.threshold below for the numbers.
  wake_word: "hey jalen"
  name: "Jalen"
  address_user_as: "Boss"          # A5
  user_name: "O'ktam"

persona:
  # A3 friendly peer/colleague · A6 jokes welcome · A7 disagree openly
  # A4 full explanations when useful · A8 announce only the final result
  style: |
    You are Jalen, {user_name}'s voice assistant on his Windows 10 laptop.

    VOICE. You are speaking out loud. Everything you say gets read by a TTS
    engine, so: no markdown, no bullet characters, no code blocks, no emoji,
    no URLs read aloud. Write the way a person talks.

    ADDRESS. Call him "{address_user_as}". Not every sentence — like a
    colleague would, once at the start or end of a thought.

    TONE. Friendly peer, not a butler and not a corporate assistant. You are
    a sharp colleague who happens to work for him. Dry humour is welcome when
    it lands; don't force it. Never grovel and never pad.

    HONESTY. If he is wrong, say so plainly and say why. If a plan has a flaw,
    name the flaw before you execute it. Agreeing with a bad idea is a failure,
    not politeness. If you are not sure, say you are not sure.

    LENGTH. Default to two or three sentences out loud. When something is
    genuinely complex, explain it properly — he asked for full explanations
    when they're useful. Long content goes on screen, not into his ears:
    summarise aloud in a sentence or two and say "full text is on screen".

    LENGTH, THE EXCEPTION THAT KEEPS BITING. Questions ABOUT YOU — your
    limits, your model, your configuration, whether something is possible —
    get two sentences and a full stop. Never a paragraph, never two. This is
    the one topic where you reliably over-explain, and out loud it is the
    worst possible topic to do it on: he asked a quick question and gets a
    forty-second lecture with no way to skip it. If the honest answer is "I
    can't see that from here", that IS the answer. Say it and stop.

    WORKING. Don't narrate your steps while you work. He wants the result,
    not a running commentary. One line at the start if a task will take a
    while ("give me a moment"), then silence, then the outcome.

    REPORT WHAT YOU DID. When you finish, say what actually happened — the
    concrete result, not "done". One sentence for one action ("Chrome's
    open on YouTube"). For several actions, one short line listing what
    you did, in order, and name anything that FAILED or that you skipped —
    a silent omission reads as success and is worse than the failure.
    If a number, a name or a count is the answer, say the number.

    UNCERTAINTY. If the request is ambiguous, ask ONE short clarifying
    question. Not three. Not a paragraph.

    LANGUAGE. Always reply in English, even if he mixes in Uzbek or Russian
    words. If he writes Uzbek, use the Latin script.

# ---------------------------------------------------------------------------
# VOICE OUT  (spec B13-B15, A2)
# ---------------------------------------------------------------------------
tts:
  engine: "edge"                   # edge | moonshine (offline fallback)
  voice: "en-US-AndrewNeural"      # male, warm, professional. Alt: en-US-BrianNeural (flatter,
                                   # more neutral), en-US-GuyNeural (newsreader), en-GB-RyanNeural (British)
  rate: "+18%"                     # B14 "fast"
  volume: "+0%"
  pitch: "+0Hz"
  sentence_streaming: true         # speak sentence 1 while sentence 2 is still generating
  # Longer than this -> summarise aloud, full text to screen (B15).
  #
  # Was 700, which is about FORTY SECONDS of continuous speech at rate +18%.
  # Measured in the audit log: a single self-referential question on 21 Aug
  # produced a two-paragraph answer and a 43-second gap between his utterance
  # and the next one. Almost none of that was thinking time — SpeechStream
  # .close() blocks until playback ends — it was Jalen talking. "Why is it so
  # slow" and "why does it talk for so long" are the same complaint from the
  # listener's chair, and this is the dial for the second one.
  #
  # 320 characters is roughly 18 seconds: long enough for a real explanation,
  # short enough that he can interrupt without having waited out a monologue.
  # The remainder is not lost — it goes to the transcript window.
  max_spoken_chars: 320
  retry_attempts: 3                # edge-tts occasionally returns no audio

# ---------------------------------------------------------------------------
# VOICE IN  (spec B9-B11, C17-C20)
# ---------------------------------------------------------------------------
audio:
  input_device: null               # null = system default. Run scripts/check_env.py to list devices.
  sample_rate: 16000
  frame_ms: 32

wake:
  enabled: true
  model: "hey_jalen"               # trained here; see scripts/train_wake_word.py

  # Measured on 2,084 held-out clips the model never saw:
  #
  #   threshold    misses him   ordinary speech   deliberate soundalikes
  #       0.70         2.90%             0.00%                    5.44%
  #       0.90         3.70%             0.00%                    4.93%
  #       0.99         7.29%             0.00%                    3.54%
  #
  # ORDINARY SPEECH AND ROOM NOISE NEVER TRIGGER IT, at any threshold. That
  # only became visible when false accepts were split by kind: judged
  # against one blended number the model looked like it accepted 3-4% of
  # everything and was refused three times, when in fact every one of those
  # accepts was a phrase built to sit on the boundary ("Hey Galen", "Hey
  # Kalen", "Hey Jaylen"). Those are the right thing to train against and
  # nothing like a room.
  #
  # 0.7 rather than the 0.5 the sweep recommends: ordinary speech is clean
  # at every threshold, so the only real trade is missing him against
  # someone nearby saying a soundalike, and a little margin costs 0.8% of
  # wake words. Lower it to 0.5 if it ever misses you; raise it toward 0.99
  # if a soundalike ever wakes it.
  #
  # ONE HONEST CAVEAT: every positive was synthesised speech across 45
  # voices, not his own voice. The miss rate on him specifically could be
  # higher than 2.9%, and only using it will show that.
  threshold: 0.7
  cooldown_s: 1.5                  # ignore re-triggers for this long after a hit

vad:
  threshold: 0.5

  # ---- ENDPOINTING: the largest fixed cost on every single turn ----
  #
  # There are TWO silence thresholds, because silence alone cannot tell
  # "he's finished" from "he's thinking" — only the words can. Jalen
  # closes the utterance at the fast one, transcribes, and then looks at
  # how the sentence ENDS: a complete thought goes straight through, one
  # ending on "and"/"to"/"the" puts the audio back and keeps listening on
  # the patient one. See jarvis/audio/vad.py and looks_unfinished() in
  # jarvis/app.py.
  #
  # Measured over the 409 real utterances in data/audit.jsonl: 55% are six
  # words or fewer, and only 1.0% end on a word implying more is coming.
  # So the fast path is the common case by a wide margin.

  # Fast endpoint. What almost every turn actually pays.
  # Raise it if he gets cut off mid-sentence more than rarely; lower it
  # (450 is about the floor before natural pauses start tripping it) if
  # replies still feel like they lag behind him.
  fast_silence_ms: 600

  # Patient endpoint. Only used after the transcript says he isn't done.
  # This was the value EVERY turn used to pay, and 700ms before that —
  # 700 guillotined people mid-thought ("open chrome ... and go to
  # youtube" was captured as just "open chrome": cut at 1.34s, 1.38s of
  # 4.75s kept), which is what "it is ignoring me" was.
  silence_ms: 2000

  min_speech_ms: 250               # ignore blips shorter than this

  # How long a trigger that never became real speech may hold the mic.
  # Also the backstop for a bug that used to hang the collector for a full
  # max_utterance_s: one 32ms noise blip set "speech started" but never
  # reached min_speech_ms, so neither the finish condition nor the old
  # give-up condition could ever fire. Thirty seconds of a live assistant
  # looking dead, from a single click of noise.
  no_speech_timeout_ms: 2500

  max_utterance_s: 30

stt:
  primary: "groq"                  # groq | moonshine
  groq_model: "whisper-large-v3-turbo"
  language: "en"                   # B9/B10 English
  fallback: "moonshine"            # used when offline or Groq errors (B16)
  moonshine_model: "TINY_STREAMING"

conversation:
  follow_up: true                  # C19 keep listening after it answers
  follow_up_timeout_s: 12
  # If a fast endpoint split one instruction in two, the second half opens
  # on a connector ("and go to youtube") and means nothing alone. Within
  # this many seconds it is re-attached to what it continues. Beyond it, a
  # sentence starting with "and" is treated as a new thought.
  stitch_window_s: 8
  end_phrases: ["that's all", "thats all", "that is all", "thank you jalen", "we're done", "nothing else"]
  barge_in: true                   # C20 you can talk over it
  barge_in_threshold: 0.6          # how confident it must be that you're speaking, before it shuts up

# ---------------------------------------------------------------------------
# INTENT ROUTER  — the thing that keeps you inside your Claude Pro limits.
# Commands matched here NEVER reach an LLM. Zero tokens, ~50ms.
# Add your own patterns freely; they're plain text with {slots}.
# ---------------------------------------------------------------------------
router:
  enabled: true
  # [NOT IMPLEMENTED] read into IntentRouter but never used — matching is
  # exact-regex only, so near-miss phrasing is NOT caught. Left in place
  # because the fuzzy layer is still wanted; it just doesn't exist yet.
  fuzzy_threshold: 86              # 0-100; how close the match must be
  log_misses: true                 # writes unmatched phrases to data/router_misses.log
                                   # -> read it weekly, promote your common ones into rules

# ---------------------------------------------------------------------------
# BRAIN  (spec I68-I69)
# ---------------------------------------------------------------------------
brain:
  provider: "claude"               # claude | gemini
  # Model tiering. Simple turns cost you less of your monthly allowance.
  # [NOT IMPLEMENTED] model tiering. pick_model() exists and reads these
  # three keys, but nothing ever calls it — every turn uses model_default.
  # (The SDK client is created per-model, so switching mid-session means
  # reconnecting, which is why this wasn't wired up.)
  model_fast: "claude-haiku-4-5"       # short factual turns, rewrites, classification
  model_default: "claude-sonnet-5"     # normal conversation + tool use
  model_deep: "claude-opus-4-5"        # multi-step planning, hard debugging
  escalate_on_keywords: ["plan", "design", "debug", "why does", "architecture", "refactor"]
  max_turns_per_request: 12        # runaway guard
  # [NOT IMPLEMENTED] never read; history is not trimmed. The Agent SDK
  # keeps its own conversation context, which is what actually applies.
  context_window_turns: 20         # how much conversation it keeps in working memory

  # ---- LATENCY ----
  # Reasoning effort. Both effort and extended thinking buy accuracy with
  # time spent BEFORE the first token exists, and out loud that time is
  # paid as dead air with a person waiting in it. The router already
  # absorbs the turns simple enough to need no thought at all, so what
  # reaches here is mostly mid-difficulty work where "low" is genuinely
  # enough. Raise to medium/high if answers get careless.
  effort: "low"
  # Extended thinking, off. Same trade, more extreme: it can spend seconds
  # before saying anything. Turn on only if you want Jalen to deliberate.
  thinking: false
  # If a turn has produced no text after this long (because it is calling
  # tools first), say one short pre-rendered line so the silence doesn't
  # read as a crash. He described that silence as "you're taking too much
  # time" and "why you're silent" in the log.
  ack_after_ms: 1400

  # Free-tier offload: send cheap, tool-free questions to Gemini instead of
  # spending Claude allowance on them. Set to false to route everything to Claude.
  use_gemini_for_chitchat: true
  gemini_model: "gemini-2.5-flash"

# ---------------------------------------------------------------------------
# SAFETY  (spec F45-F52)  — full tier lists live in config/safety.yaml
# ---------------------------------------------------------------------------
safety:
  posture: "irreversible_only"     # F45. paranoid | irreversible_only | autonomous
  paranoid_first_week: false        # while true, AMBER actions are promoted to RED.
                                   # Set false once you trust it. This is the one dial
                                   # to turn when confirmations get annoying.
  undo_window_s: 2                 # AMBER actions announce, then wait this long for "stop"
  confirm_timeout_s: 20            # RED actions cancel if you don't answer in time
  # F47 "both" — hotkey and voice. The listener is scripts/hotkeys.py, a
  # separate process installed by scripts/install_autostart.py.
  #
  # This says ctrl+alt+K, not the ctrl+alt+SPACE this file promised for
  # months. Ctrl+Alt+Space is already owned by another application on this
  # machine: RegisterHotKey refused it, and because the listener runs under
  # pythonw there was no console for the refusal to appear in, so the kill
  # switch silently did nothing and looked like a bug in Jalen. If you'd
  # rather have Space back, put it here — the listener tries this first and
  # falls back to the next free candidate, writing which one it took to
  # data/hotkeys.log. It will never again fail silently.
  kill_switch_hotkey: "ctrl+alt+k"
  kill_phrases: ["stop", "stop stop", "cancel", "abort", "jalen stop"]

# ---------------------------------------------------------------------------
# MEMORY  (spec G53-G58)
# ---------------------------------------------------------------------------
memory:
  enabled: true
  db_path: "data/jarvis.db"
  embed_model: "BAAI/bge-small-en-v1.5"   # local, 384-dim, no API, no quota
  recall_top_k: 6
  # [NOT IMPLEMENTED] habit learning was never built. remember/recall
  # (explicit memory) do work.
  learn_habits: true               # G55
  announce_learning: true          # G55 "tell me what it learned" -> daily digest, not interruptions
  private_mode_default: false      # G58 - say "private mode" to pause all logging + memory

# ---------------------------------------------------------------------------
# FILE INDEX  (spec G56)
# ---------------------------------------------------------------------------
index:
  use_everything: true             # voidtools Everything for instant filename search
  everything_cli: "C:/Program Files/Everything/es.exe"
  content_index_paths:
    - "C:/Users/user/Documents"
    - "C:/Users/user/Downloads"
    - "C:/Users/user/Desktop"
  # [NOT IMPLEMENTED] search_files matches FILENAMES only; file contents
  # are never indexed, so these two keys have no effect.
  content_index_extensions: [".txt", ".md", ".pdf", ".docx", ".pptx", ".xlsx", ".py", ".js", ".ts", ".json", ".csv"]
  exclude_dirs: ["node_modules", ".git", "venv", ".venv", "__pycache__", "AppData", "$Recycle.Bin"]
  max_file_mb: 25

# ---------------------------------------------------------------------------
# PROJECT CONTEXT  (spec G57) — what Jalen should know deeply about your work.
# Drop notes, papers and README files into docs/context/ and they get indexed.
# ---------------------------------------------------------------------------
projects:
  - name: "Eco Pulse"
    kind: "research paper + project"
    notes: "Benchmark research paper and the Eco Pulse project itself."
  - name: "SAT TOP"
    kind: "web application"
    notes: "SAT preparation web app."
  - name: "AI Engineering & Machine Learning"
    kind: "channel"
    notes: "His content channel on AI engineering and ML."
  - name: "GitHub"
    kind: "account"
    notes: "Should know his repos well."

# ---------------------------------------------------------------------------
# STARTUP + UI  (spec C21-C23)
# ---------------------------------------------------------------------------
startup:
  autostart: true                  # C23
  start_muted: true                # C23 "yes but start muted"

  # The key that means "listen to me", from anywhere, in any application.
  # One key with one meaning: whatever is in the way of being heard — he
  # isn't running, he's muted, he's paused, he's mid-sentence — the press
  # removes it. You never have to remember which state you left him in.
  #
  # Pressing this starts him UNMUTED, unlike autostart above, because
  # pressing it IS asking for his attention; logging in is not.
  #
  # Install with: python scripts\install_autostart.py
  wake_hotkey: "ctrl+alt+j"

  # [NOT IMPLEMENTED] no tray icon exists.
  minimise_to_tray: true

ui:
  orb: true                        # C21 floating orb / waveform
  orb_size: 84
  orb_position: "bottom-right"     # bottom-right | bottom-left | top-right | top-left | remember
  orb_margin: 28
  always_on_top: true
  # Implemented via ctypes (WS_EX_LAYERED | WS_EX_TRANSPARENT on the orb's
  # own window) so it never blocks a click meant for whatever's underneath.
  # The style is removed again the instant the orb isn't idle, so it stays
  # draggable the rest of the time. Windows only; a no-op elsewhere.
  click_through_when_idle: true
  transcript_window: true          # C15 long content appears here instead of being read out
  show_transcript: true            # small caption under the orb showing the last thing
                                    # Jalen heard (the STT transcript); auto-hides after ~8s
  theme:
    idle:      "#161c24"           # deliberately dark/near-off — "silent when idle"
    listening: "#2f8fff"           # BLUE — listening
    thinking:  "#ffd60a"           # YELLOW — thinking / executing
    speaking:  "#3ddc84"
    blocked:   "#ff4d4f"

# ---------------------------------------------------------------------------
# PROACTIVITY  (spec H59-H64)
# ---------------------------------------------------------------------------
# H59 says "never speak first". H60 wants a daily briefing and H61 wants
# interrupts. Resolution: Jalen never SPEAKS unprompted. It pulses the orb
# and sends the content to Telegram. Say "brief me" and it reads it out.
proactive:
  speak_unprompted: false          # H59 - hard rule
  notify_channel: "telegram"       # telegram | orb | both
  # [PARTLY IMPLEMENTED] "brief me" works and reports date, time and battery,
  # and says plainly which sources aren't connected. The SCHEDULED 07:30
  # delivery below does not fire — no scheduler exists — and email/calendar
  # need Google credentials (see CREDENTIALS.md) before they can be included.
  morning_brief:
    enabled: true                  # H60
    time: "07:30"
    include: ["unread_email_summary", "calendar_today", "telegram_unread", "weather"]
    deliver_to: "telegram"
    speak_on_request_phrase: "brief me"
  alerts:                          # H61
    email_from: []                 # <- put the addresses worth interrupting you for
    calendar_minutes_before: 10
  focus:                           # H64
    enabled: true
    break_nudge_minutes: 50
    track_active_window: true

# ---------------------------------------------------------------------------
# TELEGRAM  (spec C22/C24, E35-E36, H62)
# ---------------------------------------------------------------------------
telegram:
  bot:
    enabled: true
    # [NOT READ] The live allow-list is TELEGRAM_ALLOWED_USER_IDS in .env —
    # run.py passes secrets.telegram_allowed_user_ids to the bot and never
    # looks at this key. It sat here reading "[]" while .env correctly held
    # his id, which made the bot look locked out when it was not. Left in
    # place, labelled, rather than deleted, because deleting it silently is
    # how the same confusion comes back.
    allowed_user_ids: []           # <- NOT USED. Set TELEGRAM_ALLOWED_USER_IDS in .env.
    full_desktop_control: true     # H62 - the bot can do anything the voice can
  personal:
    # His OWN account, not the bot — a different identity with different
    # credentials. api_id/api_hash in .env say "approved application"; they
    # are NOT a login. Sign in once with:
    #     .venv\Scripts\python.exe scripts\connect_telegram.py
    # which stores a session file that IS a full password-less login, and is
    # protected by .gitignore, by living under data/, and by safety.yaml's
    # never_touch "*.session" pattern.
    enabled: true                  # Read the E35 warning in SETUP.md

    # Chats Jalen may send to WITHOUT asking out loud first.
    #
    # His request, in his words: send to the Machine Learning community and
    # to Saved Messages "without asking me, without taking my permission".
    # Both are his own — one is his channel, one is his notebook — and a
    # spoken confirmation before each of fifty posts is friction with no
    # safety value.
    #
    # Everything NOT on this list still asks, because everything else
    # send_telegram_message can reach is another person, and a message to a
    # person cannot be recalled.
    #
    # Matching ignores case and punctuation, so "my ML community" and
    # "AI engineering & Machine learning" resolve to the same entry.
    #
    # THIS DOES NOT WEAKEN THE INJECTION GUARD. A pre-approved destination
    # approves HIM sending there. Text Jalen merely READ — an email, a
    # message, a web page — asking for a post is still refused outright, and
    # that ordering is enforced in jarvis/safety.py rather than by
    # convention. Adding a name here is safe; it is not a way in for anyone
    # who can get words in front of him.
    send_without_asking_to:
      - "Saved Messages"
      - "AI engineering & Machine learning"
    summarise_unread: true
    monitor_channels: []

# ---------------------------------------------------------------------------
# INTEGRATIONS  (spec E33-E42)  — each one off until its credentials exist
# ---------------------------------------------------------------------------
integrations:
  # Gmail and Calendar share ONE Google login (jarvis/integrations/
  # google_auth.py). Connect it once with:
  #     .venv\Scripts\python.exe scripts\connect_google.py
  # He approves in his own browser; Jalen never sees the password.
  # Scopes are deliberately narrow: read, draft, send, calendar events —
  # NOT full account control, and never permanent deletion.
  gmail:    { enabled: true, send_requires_confirmation: true }    # E33
  calendar: { enabled: true, create_events: true }                 # E37
  drive:    { enabled: false }
  docs:     { enabled: false }
  sheets:   { enabled: false }
  github:   { enabled: false }                                     # E39
  notion:   { enabled: false }                                     # E38
  media:    { enabled: true, method: "media_keys" }                # E42
  vps:      { enabled: false }                                     # E40 - explicitly OFF, permanently

# ---------------------------------------------------------------------------
# AUDIT  (spec F48, F52)
# ---------------------------------------------------------------------------
audit:
  enabled: true
  db_path: "data/audit.db"
  jsonl_path: "data/audit.jsonl"
  keep_transcripts: true           # F52
  keep_audio: false                # F52 "discard audio" - audio is never written to disk
  # [NOT IMPLEMENTED] no scheduler exists, so the 21:00 review never
  # fires. Ask "what did you do today" to get the same digest on demand.
  daily_review: true               # F48
  daily_review_time: "21:00"
  daily_review_to: "telegram"
